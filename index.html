<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Вход</title>
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>
    <div class="login">
        <div class="container">
            <div class="login__top">
                <img class="login-logo" src="img/logo.svg" alt="">
                <h1 class="login__title">Вход</h1>
            </div>
            <form class="login-form">
                <div class="login-form__item">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" class="login__input">
                </div>
                <div class="login-form__item">
                    <label for="password">Пароль</label>
                    <input type="password" name="password" id="password" class="login__input">
                </div>
                <div class="login-form__item">
                    <button class="login-btn">Войти</button>
                </div>
                <div class="login-form__item">
                    <a href="pages/register.html" class="login-to-register">Зарегистрироваться</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
