<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../css/sheetsList.css">
    <title>Список листов</title>
</head>
<body>
<header class="header">
    <div class="container">
        <div class="header_inner">
            <a href="boardList.html" class="header-logo">
                <img src="../img/logo.svg" alt="Логотип">
            </a>
        </div>
    </div>
</header>

<div class="list-create">
    <button class="list-create__btn">
        <img src="../img/plus.svg" alt="" class="plus-icon">
        Новый список
    </button>
</div>

    <div class="main">
        <div class="container">
            <div class="main_inner">
                <div class="lists">
                    <div class="lists__item">
                        <div class="placeholder">
                            Список
                        </div>
                        <div class="elements">
                            <label class="elements-create__label">
                                <input type="text" class="elements-create__input" placeholder="Новый элемент">
                            </label>
                            <ul class="elements-list">
                                <li class="element-item">
                                    <span class="element-placeholder">Элемент списка</span>
                                    <img src="../img/check.svg" alt="" class="check-icon">
                                </li>
                                <li class="element-item">
                                    <span class="element-placeholder">Элемент списка</span>
                                    <img src="../img/check.svg" alt="" class="check-icon">
                                </li>
                                <li class="element-item">
                                    <span class="element-placeholder">Элемент списка</span>
                                    <img src="../img/check.svg" alt="" class="check-icon">
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="lists__item">
                        <ul class="existing-lists">
                            <li class="list">
                                Список 1
                            </li>
                            <li class="list">
                                Список 2
                            </li>
                            <li class="list">
                                Список 2
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <a href="https://kospbstin.ru/" class="technical-support">Техническая поддержка</a>
            </div>
        </div>
    </footer>
</body>
</html>
