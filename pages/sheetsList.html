<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../css/sheetsList.css">
    <title>Список листов</title>
</head>
<body>
<header class="header">
    <div class="container">
        <div class="header_inner">
            <a href="boardList.html" class="header-logo">
                <img src="../img/logo.svg" alt="Логотип">
            </a>
            <h1 class="site-name">Notes</h1>
        </div>
    </div>
</header>

<div class="list-create">
    <button class="list-create__btn">
        <img src="../img/plus.svg" alt="" class="plus-icon">
        Новый список
    </button>
</div>

    <div class="main">
        <div class="container">
            <div class="main_inner">
                <div class="lists">
                    <div class="lists__item">
                        <div class="placeholder">
                            Список
                            <img src="../img/expand.svg" alt="" class="expand-icon">
                        </div>
                        <div class="elements">
                            <label class="elements-create__label" for="new-element">Новый элемент</label>
                            <input type="text" id="new-element" class="elements-create__input">
                            <ul class="elements-list">
                                <li class="element-item">
                                    <span class="element-placeholder">Элемент списка</span>
                                    <img src="../img/check.svg" alt="" class="check-icon">
                                </li>
                                <li class="element-item">
                                    <span class="element-placeholder">Элемент списка</span>
                                    <img src="../img/check.svg" alt="" class="check-icon">
                                </li>
                                <li class="element-item">
                                    <span class="element-placeholder">Элемент списка</span>
                                    <img src="../img/check.svg" alt="" class="check-icon">
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="lists__item">
                        <div class="list">
                            Список 1
                            <img src="../img/expand.svg" alt="" class="expand-icon">
                        </div>
                    </div>
                    <div class="lists__item">
                        <div class="list">
                            Список 2
                            <img src="../img/expand.svg" alt="" class="expand-icon">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <a href="https://kospbstin.ru/" class="technical-support">Техническая поддержка</a>
            </div>
        </div>
    </footer>
</body>
</html>
