<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Регистрация</title>
    <link rel="stylesheet" href="../css/register_style.css">
</head>
<body>
<div class="register">
    <div class="container">
        <div class="register__top">
            <h1 class="register__title">Регистрация</h1>
        </div>
        <form action="post" class="register-form">
            <div class="register-form__item">
                <label for="name" class="input-label">Имя</label>
                <input type="text" id="name" class="register__input">
            </div>
            <div class="register-form__item">
                <label for="email" class="input-label">E-mail</label>
                <input type="email" id="email" class="register__input">
            </div>
            <div class="register-form__item">
                <label for="password" class="input-label">Пароль</label>
                <input type="password" id="password" class="register__input">
            </div>
            <div class="register-form__item">
                <label for="repeat-password" class="input-label">Подтвердите пароль</label>
                <input type="password" id="repeat-password" class="register__input">
            </div>
            <div class="register-form__item" id="enter">
                <button class="register-btn">Зарегистрироваться</button>
            </div>
            <div class="register-form__item">
                <a href="../index.html" class="back-to-login">Назад</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
