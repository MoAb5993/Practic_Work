<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../css/boardList_style.css">
    <title>Доски</title>
</head>
<body>
<header class="header">
    <div class="container">
        <div class="header_inner">
            <a href="#" class="header-logo">
                <img src="../img/logo.svg" alt="Логотип">
            </a>
            <h1 class="site-name">Notes</h1>
        </div>
    </div>
</header>

<div class="main">
    <div class="container">
        <div class="main__inner">
            <div class="board-create">
                <button class="board-create__btn">
                    <img src="../img/plus.svg" alt="" class="plus-icon">
                    Создать доску
                </button>
                <form action="put" class="board-create-form">
                    <div class="board-create-form__item">
                        <label for="boardName" class="input-label">Название доски</label>
                        <input type="text" name="boardName" id="boardName" class="board-create-form__input">
                    </div>
                    <div class="board-create-form__item">
                        <button class="create-btn">Создать</button>
                        <button class="cancel-btn">Отменить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <div class="footer-inner">
            <a href="https://kospbstin.ru/" class="technical-support">Техническая поддержка</a>
        </div>
    </div>
</footer>
</body>
</html>
